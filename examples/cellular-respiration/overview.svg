<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="800" fill="#FBF7EE"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B1A17"/></marker>
  </defs>
  <text x="40" y="62" font-size="38" font-weight="700" fill="#1B1A17">Cellular respiration: a power town</text>
  <text x="40" y="96" font-size="20" fill="#6A6458">Glucose comes in, ATP goes out. Four stops.</text>

  <!-- cell = town wall -->
  <rect x="20" y="130" width="1160" height="640" rx="60" fill="#2B6CB0" fill-opacity="0.05" stroke="#1B1A17" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="50" y="165" font-size="18" fill="#6A6458">the cell</text>

  <!-- glucose arrives -->
  <text x="70" y="330" font-size="24" font-weight="700" fill="#2B6CB0">Glucose</text>
  <path d="M110 345 L210 400" stroke="#1B1A17" stroke-width="4" marker-end="url(#arr)"/>

  <!-- 1 glycolysis shed in the cytoplasm -->
  <polygon points="210,420 300,360 390,420" fill="#D69E2E" fill-opacity="0.45" stroke="#1B1A17" stroke-width="3"/>
  <rect x="220" y="420" width="160" height="120" fill="#D69E2E" fill-opacity="0.18" stroke="#1B1A17" stroke-width="3"/>
  <text x="300" y="490" font-size="40" font-weight="800" text-anchor="middle" fill="#E4472B">1</text>
  <text x="300" y="580" font-size="26" font-weight="700" text-anchor="middle" fill="#1B1A17" data-recall="true">Glycolysis</text>
  <text x="300" y="606" font-size="18" text-anchor="middle" fill="#6A6458">cytoplasm · 2 ATP</text>

  <!-- the mitochondrion -->
  <ellipse cx="800" cy="360" rx="330" ry="180" fill="#2F855A" fill-opacity="0.10" stroke="#1B1A17" stroke-width="4"/>
  <path d="M520 360 q 40 -90 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" fill="none" stroke="#D69E2E" stroke-width="6"/>
  <text x="800" y="210" font-size="20" text-anchor="middle" fill="#2F855A" font-weight="700">the mitochondrion (the power plant)</text>

  <!-- road from shed to plant -->
  <path d="M390 470 C 450 470, 470 420, 520 400" stroke="#1B1A17" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  <text x="440" y="500" font-size="18" fill="#6A6458">pyruvate</text>

  <!-- 2 Krebs carousel -->
  <circle cx="650" cy="300" r="44" fill="#D69E2E" fill-opacity="0.3" stroke="#1B1A17" stroke-width="3"/>
  <path d="M694 300 A44 44 0 0 1 650 344" fill="none" stroke="#1B1A17" stroke-width="3" marker-end="url(#arr)"/>
  <text x="650" y="314" font-size="36" font-weight="800" text-anchor="middle" fill="#E4472B">2</text>
  <text x="650" y="255" font-size="24" font-weight="700" text-anchor="middle" fill="#1B1A17" data-recall="true">Krebs cycle</text>

  <!-- 3 dam + turbine -->
  <rect x="860" y="270" width="160" height="60" fill="#D69E2E" fill-opacity="0.35" stroke="#1B1A17" stroke-width="3"/>
  <circle cx="990" cy="300" r="22" fill="#2F855A" stroke="#1B1A17" stroke-width="3"/>
  <text x="900" y="312" font-size="36" font-weight="800" text-anchor="middle" fill="#E4472B">3</text>
  <text x="940" y="255" font-size="24" font-weight="700" text-anchor="middle" fill="#1B1A17" data-recall="true">Electron transport</text>
  <path d="M700 300 L850 300" stroke="#6B46C1" stroke-width="4" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <text x="775" y="430" font-size="18" text-anchor="middle" fill="#6B46C1">NADH and FADH₂ carry electrons from 1 and 2 to 3</text>
  <path d="M1020 330 L1080 420" stroke="#1B1A17" stroke-width="4" marker-end="url(#arr)"/>
  <text x="1060" y="456" font-size="30" font-weight="800" text-anchor="middle" fill="#1B1A17">~30–32 ATP</text>

  <!-- 4 fork: no oxygen -->
  <path d="M300 620 C 300 680, 360 700, 440 700" stroke="#E4472B" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  <text x="250" y="680" font-size="18" text-anchor="end" fill="#E4472B">no O₂?</text>
  <circle cx="480" cy="700" r="34" fill="#E4472B" fill-opacity="0.15" stroke="#1B1A17" stroke-width="3"/>
  <text x="480" y="713" font-size="36" font-weight="800" text-anchor="middle" fill="#E4472B">4</text>
  <text x="530" y="696" font-size="24" font-weight="700" fill="#1B1A17" data-recall="true">Fermentation</text>
  <text x="530" y="722" font-size="18" fill="#6A6458">lactate or ethanol · still just 2 ATP</text>

  <!-- oxygen gate -->
  <text x="800" y="600" font-size="20" fill="#1B1A17">O₂ goes in at stop 3 and leaves as water.</text>
  <text x="800" y="628" font-size="20" fill="#1B1A17">CO₂ leaves from stop 2.</text>
</svg>
